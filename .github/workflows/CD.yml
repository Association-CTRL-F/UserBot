name: CD

on:
  release:
    types:
      - published

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_push:
    name: Build and push OCI image to registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: registry.ctrl-f.info/ctrlfdocker/userbot
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest

      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: registry.ctrl-f.info
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          file: ./docker/Dockerfile
          context: .
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}

  pull:
    name: Pull the image and restart the container
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Executing remote ssh commands
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login registry.ctrl-f.info -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin
            docker pull registry.ctrl-f.info/ctrlfdocker/userbot:latest && docker compose -f docker/compose.yml up -d userbot
